<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LÍA · Tu novia virtual</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1b1025, #3b173f);
  color: white;
  min-height: 100vh;
}

.container {
  width: 92%;
  max-width: 500px;
  margin: auto;
  padding: 30px 0;
}

.logo {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin-top: 20px;
}

.subtitle {
  text-align: center;
  opacity: .8;
  margin-bottom: 30px;
}

.card {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-size: 14px;
  opacity: .9;
}

input, select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  outline: none;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: #e879b9;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

#chat {
  display: none;
}

.profile {
  text-align: center;
  margin-bottom: 20px;
}

.avatar {
  width: 85px;
  height: 85px;
  margin: auto;
  border-radius: 50%;
  background: linear-gradient(135deg,#e879b9,#9d5cff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
}

.messages {
  height: 330px;
  overflow-y: auto;
  background: rgba(0,0,0,.18);
  padding: 15px;
  border-radius: 15px;
}

.message {
  padding: 11px 14px;
  margin: 8px 0;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.4;
}

.her {
  background: rgba(232,121,185,.25);
}

.me {
  background: rgba(255,255,255,.15);
  margin-left: auto;
}

.chatInput {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.chatInput input {
  flex: 1;
}

.chatInput button {
  width: auto;
  margin: 0;
  padding: 12px 18px;
}

.back {
  background: transparent;
  border: 1px solid rgba(255,255,255,.2);
  margin-top: 12px;
}

.disclaimer {
  text-align: center;
  font-size: 12px;
  opacity: .6;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">LÍA</div>

  <div class="subtitle">
    Crea tu propia novia virtual
  </div>

  <!-- CREAR NOVIA -->

  <div id="create" class="card">

    <h2>💕 Creá tu novia</h2>

    <p>
      Elegí cómo querés que sea. Más adelante podrá conversar,
      recordar cosas sobre vos y tener voz.
    </p>

    <label>Nombre</label>

    <input
      id="name"
      type="text"
      placeholder="Ej: Lía"
    >

    <label>Personalidad</label>

    <select id="personality">

      <option value="cariñosa">
        Cariñosa
      </option>

      <option value="divertida">
        Divertida
      </option>

      <option value="tranquila">
        Tranquila
      </option>

      <option value="coqueta">
        Coqueta
      </option>

      <option value="aventurera">
        Aventurera
      </option>

    </select>

    <label>Forma de hablar</label>

    <select id="style">

      <option value="dulce">
        Dulce
      </option>

      <option value="casual">
        Casual
      </option>

      <option value="graciosa">
        Graciosa
      </option>

      <option value="romantica">
        Romántica
      </option>

    </select>

    <button onclick="createGirlfriend()">
      💕 Crear mi novia
    </button>

    <div class="disclaimer">
      LÍA es una inteligencia artificial.
    </div>

  </div>


  <!-- CHAT -->

  <div id="chat" class="card">

    <div class="profile">

      <div class="avatar">♥</div>

      <h2 id="girlfriendName">
        Lía
      </h2>

      <div id="girlfriendDescription">
        Tu compañera virtual
      </div>

    </div>


    <div id="messages" class="messages">

      <div class="message her" id="welcome">
        Hola ❤️. Me alegra conocerte.
      </div>

    </div>


    <div class="chatInput">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribile algo..."
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Enviar
      </button>

    </div>


    <button class="back" onclick="newGirlfriend()">
      Crear otra novia
    </button>

  </div>

</div>


<script>

let girlfriend = {
  name: "",
  personality: "",
  style: ""
};


function createGirlfriend() {

  const name =
    document.getElementById("name").value.trim();

  const personality =
    document.getElementById("personality").value;

  const style =
    document.getElementById("style").value;


  if (!name) {

    alert("Escribí un nombre para tu novia ❤️");

    return;
  }


  girlfriend.name = name;
  girlfriend.personality = personality;
  girlfriend.style = style;


  document.getElementById("girlfriendName").textContent =
    name;


  document.getElementById("girlfriendDescription").textContent =
    "Personalidad " + personality +
    " · Estilo " + style;


  document.getElementById("welcome").textContent =
    "Hola ❤️ Soy " + name +
    ". Me elegiste como tu novia virtual. ¿Cómo estás hoy?";


  document.getElementById("create").style.display =
    "none";

  document.getElementById("chat").style.display =
    "block";
}



function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();


  if (!text) return;


  const messages =
    document.getElementById("messages");


  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message me";

  userMessage.textContent =
    text;

  messages.appendChild(userMessage);


  input.value = "";


  setTimeout(function() {

    const response =
      document.createElement("div");

    response.className =
      "message her";


    let answer = "";


    if (girlfriend.personality === "divertida") {

      answer =
        "Jajaja 😂 Me hiciste sonreír. Contame un poco más...";

    }

    else if (girlfriend.personality === "tranquila") {

      answer =
        "Estoy acá para escucharte ❤️. Contame qué pasó.";

    }

    else if (girlfriend.personality === "coqueta") {

      answer =
        "Mmm... me gusta cuando me hablás así 😏❤️";

    }

    else if (girlfriend.personality === "aventurera") {

      answer =
        "Eso suena interesante 😍. ¿Y si pensamos juntos qué podemos hacer?";

    }

    else {

      answer =
        "Ay ❤️ me gusta que me cuentes esas cosas. Estoy acá con vos.";

    }


    response.textContent =
      answer;

    messages.appendChild(response);

    messages.scrollTop =
      messages.scrollHeight;

  }, 600);

}



function newGirlfriend() {

  document.getElementById("chat").style.display =
    "none";

  document.getElementById("create").style.display =
    "block";

  document.getElementById("messages").innerHTML =
    '<div class="message her" id="welcome">Hola ❤️. Me alegra conocerte.</div>';

}

</script>

</body>
</html>
